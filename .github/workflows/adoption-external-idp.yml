name: adoption-external-idp

on:
  pull_request:
    paths-ignore:
      - ".planning/**"
      - "prompts/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".planning/**"
      - "prompts/**"
  workflow_dispatch:

jobs:
  keycloak:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KEYCLOAK_BASE_URL: http://localhost:8080
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RELYRA_TEST_DATABASE: relyra_test
    strategy:
      fail-fast: false
      matrix:
        otp: [28]
        elixir: ["1.19.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Start Keycloak with adoption realm import
        run: |
          docker run -d --name keycloak-adoption -p 8080:8080 \
            -e KEYCLOAK_ADMIN=admin \
            -e KEYCLOAK_ADMIN_PASSWORD=admin \
            -e KC_HOSTNAME=localhost \
            -e KC_HOSTNAME_STRICT=false \
            -e KC_HOSTNAME_STRICT_HTTPS=false \
            -e KC_HTTP_ENABLED=true \
            -e KC_HEALTH_ENABLED=true \
            -v "$PWD/docker/keycloak/realm-relyra-adoption.json:/opt/keycloak/data/import/realm-relyra-adoption.json:ro" \
            quay.io/keycloak/keycloak:26.0.7 \
            start-dev --import-realm --http-port=8080

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/realms/relyra-adoption/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Keycloak failed to become ready" >&2
          docker logs keycloak-adoption
          exit 1

      - name: External IdP adoption lane
        run: mix ci.external_idp

      - name: Stop Keycloak
        if: always()
        run: docker rm -f keycloak-adoption || true
