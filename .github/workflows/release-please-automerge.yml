name: Release Please Auto Merge

# Merges eligible release-please PRs after security-gates (OTP 27+28) pass.
# Pair with release-please-pr-checks.yml which dispatches checks on bot PRs.

on:
  workflow_run:
    workflows:
      - security-gates
    types:
      - completed

concurrency:
  group: release-please-automerge-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto-merge eligible Release Please PR
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.head_branch == 'main' ||
           github.event.workflow_run.head_branch == 'release-please--branches--main') }}
    runs-on: ubuntu-latest

    steps:
      - name: Find eligible Release Please PR
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          prs_json="$(
            gh pr list \
              --state open \
              --base main \
              --author app/github-actions \
              --json number,title,headRefName,baseRefName,isDraft,mergeable,files,url
          )"

          eligible_json="$(
            jq '
              [
                .[]
                | select(.headRefName == "release-please--branches--main")
                | select(.baseRefName == "main")
                | select(.isDraft == false)
                | select(.title | test("^chore\\(main\\): release [0-9]+\\.[0-9]+\\.[0-9]+$"))
              ]
            ' <<< "$prs_json"
          )"

          count="$(jq 'length' <<< "$eligible_json")"

          if [[ "$count" == "0" ]]; then
            echo "No eligible Release Please PR found."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$count" != "1" ]]; then
            echo "Expected exactly one eligible Release Please PR, found $count."
            jq -r '.[].url' <<< "$eligible_json"
            exit 1
          fi

          mergeable="$(jq -r '.[0].mergeable' <<< "$eligible_json")"
          if [[ "$mergeable" != "MERGEABLE" ]]; then
            echo "Release Please PR is not currently mergeable: $mergeable"
            exit 1
          fi

          actual_files="$(jq -r '.[0].files[].path' <<< "$eligible_json" | sort | paste -sd ',' -)"
          expected_files=".release-please-manifest.json,CHANGELOG.md,mix.exs"

          if [[ "$actual_files" != "$expected_files" ]]; then
            echo "Release Please PR changed unexpected files."
            echo "Expected: $expected_files"
            echo "Actual:   $actual_files"
            exit 1
          fi

          number="$(jq -r '.[0].number' <<< "$eligible_json")"
          url="$(jq -r '.[0].url' <<< "$eligible_json")"

          echo "Eligible Release Please PR: $url"
          {
            echo "found=true"
            echo "number=$number"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for required security-gates on release PR
        if: ${{ steps.candidate.outputs.found == 'true' }}
        id: wait_checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          required_checks=("security (27, 1.19.5)" "security (28, 1.19.5)")
          deadline=$((SECONDS + 900))

          while [[ "$SECONDS" -lt "$deadline" ]]; do
            all_pass=true

            for check in "${required_checks[@]}"; do
              state="$(
                gh pr checks "$PR_NUMBER" --json name,state -q \
                  ".[] | select(.name == \"$check\") | .state" 2>/dev/null | head -1 || true
              )"

              if [[ "$state" != "SUCCESS" && "$state" != "pass" ]]; then
                echo "Waiting for $check (state: ${state:-missing})"
                all_pass=false
                break
              fi
            done

            if [[ "$all_pass" == "true" ]]; then
              echo "All required checks passing."
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 30
          done

          echo "Timed out waiting for security-gates on PR #${PR_NUMBER}"
          gh pr checks "$PR_NUMBER" || true
          exit 1

      - name: Merge Release Please PR
        if: ${{ steps.candidate.outputs.found == 'true' && steps.wait_checks.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.candidate.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --merge --delete-branch
