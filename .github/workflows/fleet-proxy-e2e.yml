name: fleet-proxy-e2e

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      run_rulestead_canary:
        description: Run the moving Rulestead main coexistence canary
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fleet-proxy-e2e:
    name: fleet-proxy-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run hermetic fleet proxy E2E
        run: npm run demo:fleet-proxy

      - name: Upload fleet proxy diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-proxy-e2e-${{ github.run_id }}
          path: |
            playwright-report/fleet-proxy-*/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 7

  rulestead-main-canary:
    name: rulestead-main-canary
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_rulestead_canary) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Relyra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Rulestead main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szTheory/rulestead
          ref: main
          path: rulestead

      - name: Run Rulestead coexistence canary
        env:
          RULESTEAD_DIR: ${{ github.workspace }}/rulestead
        run: ./scripts/test_rulestead_proxy_canary.sh

      - name: Upload canary diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulestead-main-canary-${{ github.run_id }}
          path: playwright-report/rulestead-canary/**
          if-no-files-found: ignore
          retention-days: 7
