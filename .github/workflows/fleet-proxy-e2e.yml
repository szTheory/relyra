name: fleet-proxy-e2e

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      run_rulestead_canary:
        description: Run the moving Rulestead main coexistence canary
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fleet-proxy-e2e:
    name: fleet-proxy-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run hermetic fleet proxy E2E
        env:
          FLEET_PROXY_STATUS_PATH: ${{ runner.temp }}/relyra-fleet-proxy-status.json
        run: npm run demo:fleet-proxy

      - name: Require bounded Fleet status receipt
        id: fleet_status_guard
        if: always()
        env:
          FLEET_PROXY_STATUS_PATH: ${{ runner.temp }}/relyra-fleet-proxy-status.json
        run: |
          if [[ ! -f "$FLEET_PROXY_STATUS_PATH" || -L "$FLEET_PROXY_STATUS_PATH" ]]; then
            echo "::error::fleet_proxy_status_missing: required bounded receipt was not produced."
            exit 1
          fi
          status_bytes="$(wc -c < "$FLEET_PROXY_STATUS_PATH")"
          if (( status_bytes == 0 || status_bytes > 512 )); then
            echo "::error::fleet_proxy_status_invalid: receipt must be between 1 and 512 bytes."
            exit 1
          fi
          jq -e '
            keys == ["checks_failed", "checks_passed", "failure_category", "outcome", "owner", "phase", "run_id", "schema_version"] and
            .schema_version == 1 and .owner == "fleet-proxy-e2e" and
            (.run_id | test("^[a-f0-9]{16}$")) and
            (.phase | IN("setup", "solo", "proxy", "fleet", "complete")) and
            (.outcome | IN("passed", "failed", "cancelled")) and
            (.failure_category | IN("none", "setup", "assertion", "timeout", "cancelled")) and
            (.checks_passed | type == "number" and . >= 0 and . <= 12) and
            (.checks_failed | type == "number" and . >= 0 and . <= 1) and
            ((.outcome == "passed" and .failure_category == "none" and .phase == "complete" and .checks_failed == 0) or
             (.outcome == "failed" and .failure_category != "none" and .phase != "complete" and .checks_failed == 1) or
             (.outcome == "cancelled" and .failure_category == "cancelled" and .phase != "complete" and .checks_failed == 1))
          ' "$FLEET_PROXY_STATUS_PATH" >/dev/null || {
            echo "::error::fleet_proxy_status_invalid: receipt does not match the bounded Fleet schema."
            exit 1
          }

      - name: Upload safe Fleet status
        if: ${{ always() && steps.fleet_status_guard.conclusion == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fleet-proxy-e2e-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relyra-fleet-proxy-status.json
          if-no-files-found: error
          retention-days: 3

  rulestead-main-canary:
    name: rulestead-main-canary
    if: >-
      ${{ github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_rulestead_canary) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Relyra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Rulestead main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: szTheory/rulestead
          ref: main
          path: rulestead

      - name: Run Rulestead coexistence canary
        env:
          RULESTEAD_DIR: ${{ github.workspace }}/rulestead
          RULESTEAD_CANARY_STATUS_PATH: ${{ runner.temp }}/relyra-rulestead-canary-status.json
        run: ./scripts/test_rulestead_proxy_canary.sh

      - name: Require bounded canary status receipt
        id: canary_status_guard
        if: always()
        env:
          RULESTEAD_CANARY_STATUS_PATH: ${{ runner.temp }}/relyra-rulestead-canary-status.json
        run: |
          if [[ ! -f "$RULESTEAD_CANARY_STATUS_PATH" || -L "$RULESTEAD_CANARY_STATUS_PATH" ]]; then
            echo "::error::rulestead_canary_status_missing: required bounded receipt was not produced."
            exit 1
          fi
          status_bytes="$(wc -c < "$RULESTEAD_CANARY_STATUS_PATH")"
          if (( status_bytes == 0 || status_bytes > 512 )); then
            echo "::error::rulestead_canary_status_invalid: receipt must be between 1 and 512 bytes."
            exit 1
          fi
          jq -e '
            keys == ["checks_failed", "checks_passed", "failure_category", "outcome", "owner", "phase", "run_id", "schema_version"] and
            .schema_version == 1 and .owner == "rulestead-main-canary" and
            (.run_id | test("^[a-f0-9]{16}$")) and
            (.phase | IN("setup", "proxy", "relyra", "rulestead", "complete")) and
            (.outcome | IN("passed", "failed", "cancelled")) and
            (.failure_category | IN("none", "setup", "assertion", "timeout", "cancelled")) and
            (.checks_passed | type == "number" and . >= 0 and . <= 12) and
            (.checks_failed | type == "number" and . >= 0 and . <= 1) and
            ((.outcome == "passed" and .failure_category == "none" and .phase == "complete" and .checks_failed == 0) or
             (.outcome == "failed" and .failure_category != "none" and .phase != "complete" and .checks_failed == 1) or
             (.outcome == "cancelled" and .failure_category == "cancelled" and .phase != "complete" and .checks_failed == 1))
          ' "$RULESTEAD_CANARY_STATUS_PATH" >/dev/null || {
            echo "::error::rulestead_canary_status_invalid: receipt does not match the bounded canary schema."
            exit 1
          }

      - name: Upload safe canary status
        if: ${{ always() && steps.canary_status_guard.conclusion == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rulestead-main-canary-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/relyra-rulestead-canary-status.json
          if-no-files-found: error
          retention-days: 3
