name: keycloak-proxy-e2e

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "43 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keycloak-proxy-e2e:
    name: keycloak-proxy-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public Keycloak proxy E2E
        run: npm run demo:keycloak-proxy
