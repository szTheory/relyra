name: demo-app-ci

on:
  pull_request:
    paths-ignore:
      - ".planning/**"
      - "prompts/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".planning/**"
      - "prompts/**"
  workflow_dispatch:

jobs:
  demo-app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    strategy:
      fail-fast: false
      matrix:
        otp: [27, 28]
        elixir: ["1.19.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install root dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Demo App CI
        run: mix ci.demo_app
