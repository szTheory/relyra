name: security-gates

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths-ignore:
      - "prompts/**"
  push:
    branches:
      - main
    paths-ignore:
      - "prompts/**"
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RELYRA_XML_STRATEGY: pure_beam
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RELYRA_TEST_DATABASE: relyra_test
    strategy:
      fail-fast: false
      matrix:
        otp: [27, 28]
        elixir: ["1.19.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup BEAM
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Package consumer contracts
        run: |
          scripts/check_clean_room_consumer.sh --profile full
          scripts/check_clean_room_consumer.sh --profile minimal --concurrency-check
          scripts/check_clean_room_consumer.sh --profile contracts

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install browser dependencies
        run: npm install

      - name: Prepare demo test metadata
        env:
          MIX_ENV: test
        run: |
          mix cmd --cd demo/ledger_loop mix deps.get
          mix cmd --cd demo/ledger_loop mix compile

      - name: Quality gate
        run: mix qa

      - name: Security lane
        run: mix ci.security

      - name: Evidence contract
        run: mix ci.evidence

      - name: Phase 73 reconciliation
        run: mix ci.phase73.reconciliation

      - name: Verification lane
        run: mix ci.verify

      - name: Verify NIF checksum manifest for non-pure strategy
        if: env.RELYRA_XML_STRATEGY != 'pure_beam'
        run: .github/scripts/verify_nif_checksums.sh

      - name: Integration lane
        run: mix ci.integration

      - name: Demo lane
        run: mix ci.demo

      - name: Admin UI contract lane
        run: mix ci.admin_ui

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Admin UI browser smoke
        run: npm run admin-ui:smoke

      # intentional belt-and-suspenders: this re-runs the C14N golden-oracle gate
      # directly, independent of the `mix ci.security` alias above being correctly
      # wired. if the alias ever regresses (e.g. a suite is silently dedup-skipped),
      # this standalone step still fails the build on a gate02_c14n regression.
      # keep it even though ci.security also runs `--only gate02_c14n`.
      - name: GATE-02 binary gate (gate02_c14n zero regressions)
        run: mix test --only gate02_c14n --warnings-as-errors

  phase78-cold-producer:
    name: Phase 78 cold producer (OTP ${{ matrix.otp }})
    # Cold from-scratch proof (D-12/PIPE-05) runs on main pushes, dispatches
    # and the release PR; ordinary PRs rely on the warm security matrix.
    # Each OTP producer runs on its own runner in parallel; the
    # phase78-clean-state job assembles both run receipts.
    if: always() && (github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "27"
            otp-version: "27.3.4.15"
          - otp: "28"
            otp-version: "28.4.1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RELYRA_TEST_DATABASE: relyra_phase78_receipt
      RELYRA_XML_STRATEGY: pure_beam
      PHASE78_OTP: ${{ matrix.otp }}
    steps:
      - name: Checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node 22
        if: always()
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install actionlint and ShellCheck
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          mkdir -p "$RUNNER_TEMP/phase78-tools"
          GOBIN="$RUNNER_TEMP/phase78-tools" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/phase78-tools" >> "$GITHUB_PATH"

      - name: Setup BEAM
        if: always()
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp-version }}
          elixir-version: "1.19.5"

      - name: Run cold manifest
        if: always()
        run: bash scripts/check_phase78_clean_state.sh --otp "$PHASE78_OTP" --output "$RUNNER_TEMP/phase78-otp${PHASE78_OTP}.json" --diagnostics-dir "$RUNNER_TEMP/phase78-otp${PHASE78_OTP}-diagnostics"

      - name: Validate owned producer diagnostics
        id: validate-diagnostics
        if: always()
        run: bash scripts/check_phase78_clean_state.sh --validate-diagnostics "$RUNNER_TEMP/phase78-otp${PHASE78_OTP}-diagnostics"

      - name: Upload Phase 78 producer diagnostics
        if: always() && steps.validate-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase78-producer-diagnostics-${{ github.run_id }}-${{ github.sha }}-otp${{ matrix.otp }}
          path: ${{ runner.temp }}/phase78-otp${{ matrix.otp }}-diagnostics/
          if-no-files-found: error
          retention-days: 3

      - name: Upload Phase 78 run receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase78-run-${{ github.run_id }}-${{ github.sha }}-otp${{ matrix.otp }}
          path: ${{ runner.temp }}/phase78-otp${{ matrix.otp }}.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

      - name: Remove uploaded diagnostics owned by this run
        if: success()
        run: |
          diagnostics="$RUNNER_TEMP/phase78-otp${PHASE78_OTP}-diagnostics"
          run_id="$(sed -n '1p' "$diagnostics/owner.marker")"
          bash scripts/check_phase78_clean_state.sh --cleanup-diagnostics "$diagnostics" "$run_id"

  phase78-clean-state:
    name: Phase 78 cold-state receipt
    # Assembles the parallel OTP 27/28 producer run receipts into one
    # source-bound receipt; same trigger scope as the producers.
    needs: phase78-cold-producer
    if: always() && (github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RELYRA_TEST_DATABASE: relyra_phase78_receipt
      RELYRA_XML_STRATEGY: pure_beam
    steps:
      - name: Checkout
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup BEAM for the receipt owner
        if: always()
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4.1"
          elixir-version: "1.19.5"

      - name: Download Phase 78 run receipts
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: phase78-run-${{ github.run_id }}-${{ github.sha }}-otp*
          path: ${{ runner.temp }}/phase78-runs
          merge-multiple: true

      - name: Install Mix dependencies for the receipt owner
        if: always()
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get --check-locked

      - name: Assemble source-bound receipt
        if: always()
        run: >-
          bash scripts/check_phase78_clean_state.sh --assemble
          "$RUNNER_TEMP/phase78-runs/phase78-otp27.json"
          "$RUNNER_TEMP/phase78-runs/phase78-otp28.json"
          --checkout "$GITHUB_WORKSPACE"
          --output "$PHASE78_RECEIPT_PATH"
        env:
          PHASE78_RECEIPT_PATH: ${{ runner.temp }}/phase78-candidate-receipt.json

      - name: Require Phase 78 cold-state receipt
        if: always()
        run: mix ci.phase78.receipt
        env:
          PHASE78_RECEIPT_PATH: ${{ runner.temp }}/phase78-candidate-receipt.json
