name: security-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: [27, 28]
        elixir: ["1.19.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Quality gate
        run: mix qa

      - name: Fast lane
        run: mix ci.fast

      - name: Security lane
        run: mix ci.security

      - name: Integration lane
        run: mix ci.integration

      - name: GATE-02 binary gate (gate02_c14n zero regressions)
        run: mix test --only gate02_c14n --warnings-as-errors
