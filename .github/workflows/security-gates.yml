name: security-gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RELYRA_XML_STRATEGY: pure_beam
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RELYRA_TEST_DATABASE: relyra_test
    strategy:
      fail-fast: false
      matrix:
        otp: [27, 28]
        elixir: ["1.19.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Quality gate
        run: mix qa

      - name: Fast lane
        run: mix ci.fast

      - name: Security lane
        run: mix ci.security

      - name: Verification lane
        run: mix ci.verify

      - name: Verify NIF checksum manifest for non-pure strategy
        if: env.RELYRA_XML_STRATEGY != 'pure_beam'
        run: .github/scripts/verify_nif_checksums.sh

      - name: Integration lane
        run: mix ci.integration

      - name: GATE-02 binary gate (gate02_c14n zero regressions)
        run: mix test --only gate02_c14n --warnings-as-errors
