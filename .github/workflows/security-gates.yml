name: security-gates

on:
  pull_request:
    paths-ignore:
      - ".planning/**"
      - "prompts/**"
  push:
    branches:
      - main
    paths-ignore:
      - ".planning/**"
      - "prompts/**"
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RELYRA_XML_STRATEGY: pure_beam
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      RELYRA_TEST_DATABASE: relyra_test
    strategy:
      fail-fast: false
      matrix:
        otp: [27, 28]
        elixir: ["1.19.5"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install browser dependencies
        run: npm install

      - name: Quality gate
        run: mix qa

      - name: Fast lane
        run: mix ci.fast

      - name: Security lane
        run: mix ci.security

      - name: Verification lane
        run: mix ci.verify

      - name: Verify NIF checksum manifest for non-pure strategy
        if: env.RELYRA_XML_STRATEGY != 'pure_beam'
        run: .github/scripts/verify_nif_checksums.sh

      - name: Integration lane
        run: mix ci.integration

      - name: Demo lane
        run: mix ci.demo

      - name: Admin UI contract lane
        run: mix ci.admin_ui

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Admin UI browser smoke
        run: npm run admin-ui:smoke

      # intentional belt-and-suspenders: this re-runs the C14N golden-oracle gate
      # directly, independent of the `mix ci.security` alias above being correctly
      # wired. if the alias ever regresses (e.g. a suite is silently dedup-skipped),
      # this standalone step still fails the build on a gate02_c14n regression.
      # keep it even though ci.security also runs `--only gate02_c14n`.
      - name: GATE-02 binary gate (gate02_c14n zero regressions)
        run: mix test --only gate02_c14n --warnings-as-errors
