<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <title>Relyra — Enterprise SAML, calmly verified.</title>
  <desc>Strict-by-default SAML 2.0 SP for Elixir and Phoenix.</desc>

  <!-- Brand panel: Ink background -->
  <rect width="1200" height="630" fill="#101827"/>

  <!-- Subtle Relay-Blue keyline at the foot -->
  <rect x="0" y="624" width="1200" height="6" fill="#3454D1"/>

  <!-- Logo lockup: integrated typemark (the monogram is the "R"), centered -->
  <g transform="translate(458.2 140.4) scale(4.8)">
    <g transform="translate(-0.9 5.69) scale(0.82)">
      <g stroke="#FCFBF7" stroke-width="2.95" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M5 3.5 V20.5"/>
        <path d="M5 3.5 H12.5 A5 5 0 0 1 12.5 13.5 H7.5"/>
        <path d="M9.5 11.5 L19 20.5"/>
      </g>
      <circle cx="13" cy="8.5" r="2.1" fill="#61D6C8"/>
    </g>
    <text x="16.0" y="22.5"
      font-family="'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif"
      font-weight="600" font-size="20" letter-spacing="-0.2" fill="#FCFBF7">elyra</text>
  </g>

  <!-- Canonical tagline (Paper) -->
  <text x="600" y="400" text-anchor="middle"
    font-family="'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif"
    font-weight="500" font-size="52" letter-spacing="-0.5" fill="#FCFBF7">Enterprise SAML, calmly verified.</text>

  <!-- Muted sub-line (Mist on Ink) -->
  <text x="600" y="470" text-anchor="middle"
    font-family="'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif"
    font-weight="400" font-size="30" letter-spacing="0.2" fill="#CBD5E1">Strict-by-default SAML 2.0 SP for Elixir &amp; Phoenix</text>
</svg>
