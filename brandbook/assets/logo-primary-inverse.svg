  </g>
  <text x="16.0" y="22.5" font-family="'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif" font-weight="600" font-size="20" letter-spacing="-0.2" fill="#F8FAFC">elyra</text>
