<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <title>Relyra — Trust Path</title>
  <!-- IdP endpoint: open ring, lighter binding (source) -->
  <circle cx="3.5" cy="17.5" r="2" stroke-width="1.3"/>
  <!-- relay leg in: 60deg ascent toward the seal -->
  <path d="M5.2 16.2 L9.4 10.3"/>
  <!-- relay leg out: shallower descent, asymmetric to imply direction -->
  <path d="M14.6 9.7 L18.9 13.4"/>
  <!-- SP endpoint: solid bound terminus, heavier weight = arrival/binding -->
  <circle cx="20.5" cy="14.5" r="2" fill="currentColor" stroke="none"/>
  <!-- verification seal node: teal disc, the only accent -->
  <circle cx="12" cy="9" r="4" fill="#147D77" stroke="none"/>
  <!-- check carved into the seal -->
  <path d="M10 9.1 L11.4 10.6 L14 7.2" stroke="#ffffff" stroke-width="1.5" fill="none"/>
</svg>
