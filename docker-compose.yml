name: relyra-demo

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  demo_app:
    build:
      context: .
      dockerfile: demo/ledger_loop/Dockerfile.dev
    command: mix phx.server
    volumes:
      - .:/app
      # Named volumes mask the bind mount at the nested demo paths so macOS-compiled
      # host artifacts never enter the Linux container (DKR-02, D-04).
      - relyra_deps:/app/demo/ledger_loop/deps
      - relyra_build:/app/demo/ledger_loop/_build
      # Persist runtime hex/mix state and the lock-hash stamp across down/up (DKR-03).
      - relyra_hex:/root/.hex
      - relyra_mix:/root/.mix
    working_dir: /app/demo/ledger_loop
    depends_on:
      db:
        condition: service_healthy
    environment:
      - MIX_ENV=dev
      - PGHOST=db
      - PGUSER=postgres
      - PGPASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    profiles: ["keycloak"]
    command: start-dev --import-realm --http-port=8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_APPEND: "-Dpicketlink.xmlsig.includeKeyInfo=false"
    volumes:
      - ./docker/keycloak/realm-demo-app.json:/opt/keycloak/data/import/realm-demo-app.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '{ printf \"HEAD /health/ready HTTP/1.0\\r\\n\\r\\n\" >&0; grep -q \"HTTP/1.0 200\"; } 0<>/dev/tcp/localhost/9000'"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  playwright:
    image: mcr.microsoft.com/playwright:v1.54.2-jammy
    profiles: ["browser"]
    ipc: host
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      demo_app:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    command: >
      sh -c "npm install && npx playwright test --config playwright.demo.config.mjs"
    environment:
      - BASE_URL=http://demo_app:4000

volumes:
  relyra_deps:
  relyra_build:
  relyra_hex:
  relyra_mix:
